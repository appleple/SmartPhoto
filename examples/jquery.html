<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="stylesheet" href="/style.css">
	<title>jquery-smartphoto.js</title>
</head>
<body>
	<div class="wrapper">
		<h1 class="title">jquery-smartphoto.js</h1>
		<div class="masonry">

				<a href="/large-lion.jpg" class="js-img-viewer" data-caption="Lion" data-id="lion">
					<img src="/lion.jpg" alt="" width="360"/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-camel.jpg" class="js-img-viewer" data-caption="Camel" data-id="camel">
					<img src="/camel.jpg" alt="" width="360"/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-hippo.jpg" class="js-img-viewer" data-caption="Hippo" data-id="hippo">

				</a>
			</div>
			<div class="brick">
				<a href="/large-koala.jpg" class="js-img-viewer" data-caption="Koala" data-id="koala">
					<img src="/koala.jpg" alt="" width="360" />
				</a>
			</div>
			<div class="brick">
				<a href="/large-bear.jpg" class="js-img-viewer" data-caption="Bear" data-id="bear">
					<img src="/bear.jpg" alt="" width="360"/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-rhino.jpg" class="js-img-viewer" data-caption="Rhino" data-id="rhino">
					<img src="/rhino.jpg" alt="" width="360"/>

			</div>
			<div class="brick">
				<a href="/sample.png" class="js-img-viewer" data-caption="Rhino" data-id="rhino">

				</a>
			</div>
			<div class="brick">
				<a href="/large-bear.jpg" class="js-img-viewer" data-caption="Bear" data-id="bear">
					<img src="/bear.jpg" alt="" width="360"/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-rhino.jpg" class="js-img-viewer" data-caption="Rhino" data-id="rhino">
					<img src="/rhino.jpg" alt="" width="360"/>

				<a href="/sample.png" class="js-img-viewer" data-caption="Rhino" data-id="rhino">
					<img src="/sample.png" alt="" width="360"/>
				</a>
			</div>
		</div>
	</div>

	<script
	src="https://code.jquery.com/jquery-3.6.0.min.js"
	integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
	crossorigin="anonymous"></script>
	<script type="module" src="./src/jquery.js"></script>

</html>
