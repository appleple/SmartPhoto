<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/style.css">
	<title>SmartPhoto.js</title>
	<script>
		// 診断用: ?mobile=1 が付いている場合のみ、isSmartPhoneFlag(UA判定)を
		// スマートフォンとして扱えるよう navigator.userAgent を上書きする。
		// SmartPhoto の生成(モジュール実行)より必ず先に実行させる必要がある
		if (new URLSearchParams(location.search).get('mobile') === '1') {
			Object.defineProperty(window.navigator, 'userAgent', {
				value: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
				configurable: true,
			});
		}
	</script>
</head>
<body>
	<div class="wrapper">
		<h1 class="title">SmartPhoto.js</h1>
		<div class="masonry">
			<div class="brick">
				<a href="/large-lion.jpg" class="js-img-viewer" data-caption="Lion" data-id="lion">
					<img src="/lion.jpg" width="360" alt=""/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-camel.jpg" class="js-img-viewer" data-caption="Camel" data-id="camel">
					<img src="/camel.jpg" width="360" alt=""/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-hippo.jpg" class="js-img-viewer" data-caption="Hippo" data-id="hippo">
					<img src="/hippo.jpg" width="360" alt="" />
				</a>
			</div>
			<div class="brick">
				<a href="/large-koala.jpg" class="js-img-viewer" data-caption="Koala" data-id="koala">
					<img src="/koala.jpg" width="360" alt="" />
				</a>
			</div>
			<div class="brick">
				<a href="/large-bear.jpg" class="js-img-viewer" data-caption="Bear" data-id="bear">
					<img src="/bear.jpg" width="360" alt=""/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-rhino.jpg" class="js-img-viewer" data-caption="Rhino" data-id="rhino">
					<img src="/rhino.jpg" width="360" alt=""/>
				</a>
			</div>
		</div>
	</div>
	<script type="module" src="./src/resizeFill.js"></script>
</body>
</html>
