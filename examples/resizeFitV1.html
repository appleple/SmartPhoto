<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<!-- v1系(CDN, unpkg)をそのまま読み込む。v2の開発サーバーとCSSクラス名が
	     衝突しないよう、このページ単体では v2 を一切読み込まない -->
	<link rel="stylesheet" href="https://unpkg.com/smartphoto@1.6.5/css/smartphoto.min.css"
		integrity="sha384-+WmIlgZ4AznsGTg1YV3bByhUGhU+HBu2+61vGr6TPU41tFuE4gks+OVGkYuiPRdz"
		crossorigin="anonymous">
	<link rel="stylesheet" href="/style.css">
	<title>SmartPhoto.js v1 (CDN) - resizeStyle: fill</title>
	<script>
		// 診断用: ?mobile=1 が付いている場合のみ、_isSmartPhone(UA判定)を
		// スマートフォンとして扱えるよう navigator.userAgent を上書きする
		if (new URLSearchParams(location.search).get('mobile') === '1') {
			Object.defineProperty(window.navigator, 'userAgent', {
				value: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
				configurable: true,
			});
		}
	</script>
</head>
<body>
	<div class="wrapper">
		<h1 class="title">SmartPhoto.js v1.6.5 (CDN) - resizeStyle: fill</h1>
		<div class="masonry">
			<div class="brick">
				<a href="/large-lion.jpg" class="js-img-viewer" data-caption="Lion" data-id="lion">
					<img src="/lion.jpg" width="360" alt=""/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-camel.jpg" class="js-img-viewer" data-caption="Camel" data-id="camel">
					<img src="/camel.jpg" width="360" alt=""/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-hippo.jpg" class="js-img-viewer" data-caption="Hippo" data-id="hippo">
					<img src="/hippo.jpg" width="360" alt="" />
				</a>
			</div>
			<div class="brick">
				<a href="/large-koala.jpg" class="js-img-viewer" data-caption="Koala" data-id="koala">
					<img src="/koala.jpg" width="360" alt="" />
				</a>
			</div>
			<div class="brick">
				<a href="/large-bear.jpg" class="js-img-viewer" data-caption="Bear" data-id="bear">
					<img src="/bear.jpg" width="360" alt=""/>
				</a>
			</div>
			<div class="brick">
				<a href="/large-rhino.jpg" class="js-img-viewer" data-caption="Rhino" data-id="rhino">
					<img src="/rhino.jpg" width="360" alt=""/>
				</a>
			</div>
		</div>
	</div>
	<script src="https://unpkg.com/smartphoto@1.6.5/js/smartphoto.min.js"
		integrity="sha384-6EJSJtapGocf6XTyi7uy2h8fSCS9e0Isr7Z+tbk8/7GhptxMsS+/BukPw+ckWxzt"
		crossorigin="anonymous"></script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			new SmartPhoto('.js-img-viewer', {
				resizeStyle: 'fill',
			});
		});
	</script>
</body>
</html>
